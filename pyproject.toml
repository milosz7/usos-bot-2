[project]
name = "usos-bot"
version = "0.1.0"
description = ""
authors = []
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bs4 (>=0.0.2,<0.0.3)",
    "langchain (>=0.3.27,<0.4.0)",
    "langchain-community (>=0.3.27,<0.4.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pinecone (>=7.3.0,<8.0.0)",
    "langchain-huggingface (>=0.3.1,<0.4.0)",
    "langchain-pinecone (>=0.2.11,<0.3.0)",
    "transformers (>=4.55.0,<5.0.0)",
    "torch (>=2.8.0,<3.0.0)",
    "protobuf (>=6.31.1,<7.0.0)"
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.12.7,<0.13.0"

[tool.poetry]
packages = [{include = "usos_bot", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
    "I", # isort
]
ignore = [
    "ANN204", # Missing type annotations in __init__ methods
]

[tool.ruff]
line-length = 120
exclude = [
    "*.ipynb", # ignore Jupyter notebooks
]